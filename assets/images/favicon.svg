<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e3a" />
      <stop offset="100%" stop-color="#174D32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="diyaGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1" />
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle (Deep Green) -->
  <circle cx="32" cy="32" r="30" fill="url(#leafGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Traditional Ornamental Gold Inner Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Traditional South Indian Diya / Deepam & Banana Leaf Symbol -->
  <!-- Banana Leaf Arc -->
  <path d="M14 36 C18 22, 34 16, 48 20 C42 28, 30 38, 14 36 Z" fill="#2E7D32" opacity="0.6" />
  <path d="M14 36 C28 26, 44 21, 48 20" stroke="#81C784" stroke-width="1" fill="none" />

  <!-- Brass Diya Base -->
  <path d="M22 38 C22 45, 42 45, 42 38 C42 34, 22 34, 22 38 Z" fill="url(#goldGrad)" stroke="#8C6708" stroke-width="0.8" />
  <path d="M29 44 L35 44 L37 48 L27 48 Z" fill="url(#goldGrad)" />
  <ellipse cx="32" cy="48" rx="8" ry="2" fill="url(#goldGrad)" />

  <!-- Flame Glow & Diya Flame -->
  <circle cx="32" cy="28" r="10" fill="url(#diyaGlow)" />
  <path d="M32 20 C34 25, 37 28, 35 32 C33 34, 31 34, 29 32 C27 28, 30 25, 32 20 Z" fill="#FFC107" />
  <path d="M32 23 C33 26, 35 28, 34 31 C33 32, 31 32, 30 31 C29 28, 31 26, 32 23 Z" fill="#FF5722" />
</svg>
